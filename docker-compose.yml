services:
  # Backend
  backend:
    build: ./backend
    volumes:
      - ./backend/dataset:/app/dataset
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - DEVICE=${DEVICE:-auto}
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG_MODE=false
      - DEFAULT_MODEL_ID=controlnet_scribble
      - NUM_INFERENCE_STEPS=20
      - GUIDANCE_SCALE=7.5
      - OUTPUT_IMAGE_SIZE=512
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
    networks:
      - poofit3d

  # Express proxy + React frontend
  app:
    build: 
      context: .
      dockerfile: proxy-server/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    networks:
      - poofit3d

volumes:
  huggingface_cache: {}

networks:
  poofit3d:
    driver: bridge